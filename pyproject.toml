[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omove"
version = "0.6.0"
description = "Ollama Tiered Storage Manager — move models between hot and cold stores"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "omove contributors" }]
keywords = ["ollama", "storage", "models"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
omove = "omove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omove"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
